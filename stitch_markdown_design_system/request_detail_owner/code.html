        body { background-color: #FFFFFF; }

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background dark:bg-background z-40">
<div class="flex justify-between items-center px-margin-mobile py-4 max-w-[600px] mx-auto bg-background dark:bg-background">
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity flex items-center justify-center p-2 -ml-2 rounded-full active:bg-surface-container">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back" data-weight="regular">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tighter text-primary dark:text-primary">RepairLink</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="flex-grow w-full max-w-[600px] mx-auto px-margin-mobile pb-stack-lg">
<!-- Photo Gallery (Horizontal Scroll) -->
<section class="mt-stack-sm mb-stack-md -mx-margin-mobile px-margin-mobile overflow-x-auto no-scrollbar flex gap-gutter snap-x snap-mandatory">
<div class="min-w-[280px] h-[280px] rounded-lg overflow-hidden snap-center shrink-0 relative bg-surface-container shadow-sm border border-surface-container-high">
<img class="w-full h-full object-cover" data-alt="Close up photograph of a modern smartphone with a severely shattered screen, resting on a clean white surface. High contrast, well-lit studio lighting emphasizing the crack details against the minimalist background. Light mode aesthetic, sharp focus." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDA8ko4xvVZASHl58-zGOJYyg8QwTwuBREBCuegF7z5ZM19TuighUzZURUNkygRW2BZ4pIv7YLVY3RROnl_uBSgNpc1V5U0twlndXvmWtnpwzlvksgSZlRQtcSj2djCukmO6Cg7YjFt9fv20lin-gG486tOhj-jrqttgh7ryqGN60sM0jfP7GgZhKoS8Alw-tHeXhYub8ZllZoiV8a9Gn3RIoFlGpZtNl17MbZNMpXU5Ky7d0XH6_Zyug"/>
</div>
<div class="min-w-[280px] h-[280px] rounded-lg overflow-hidden snap-center shrink-0 relative bg-surface-container shadow-sm border border-surface-container-high">
<img class="w-full h-full object-cover" data-alt="A slightly angled, detailed view of the back of a modern smartphone, showing a spiderweb crack originating from the corner near the camera lens. White minimal setting, soft diffused lighting, highlighting the damage on the device's sleek surface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBz5Zd5VT1IUiU1nugPAigZ7dwIpZj778cLg0CNP2ZnHXTHEWF7MjRdrEoDNPuPqSx04xzlqng8pJC9ixomr-Iv0Tm5PwTbAz6kB3fiPvHo4c7ft2X9gow9bmaHvTR5PnkVxxgNrxzwXb-mm5xAB0f9KYW8jSJZncTYToz6AmoRYb33_IzD4A0ORfJuTfKJywmPH_u2P_PdbVlos6pcnqeRrGzM3KH_t1ZwGPAtuXgML5qZXcr4N6nnZQ"/>
</div>
</section>
<!-- Device Info -->
<section class="mb-stack-md flex flex-col gap-stack-sm">
<div class="flex items-center gap-base">
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center shadow-sm text-primary">
<span class="material-symbols-outlined text-3xl" data-icon="smartphone" data-weight="fill">smartphone</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-primary">iPhone 14 Pro</h2>
<div class="flex items-center gap-1 mt-1 text-error-red">
<span class="material-symbols-outlined text-sm" data-icon="broken_image" data-weight="fill">broken_image</span>
<span class="font-body-md text-body-md font-medium">Cracked Screen</span>
</div>
</div>
</div>
</section>
<!-- Customer Notes -->
<section class="mb-stack-md">
<h3 class="font-label-md text-label-md text-secondary uppercase tracking-widest mb-2">Customer Notes</h3>
<div class="bg-surface-container-low p-4 rounded-lg border border-surface-container text-on-surface-variant font-body-md leading-relaxed shadow-sm">
                "Dropped on concrete, screen is completely unresponsive to touch on the bottom half. Need it fixed ASAP for work."
            </div>
</section>
<!-- Customer Contact -->
<section class="mb-stack-lg">
<h3 class="font-label-md text-label-md text-secondary uppercase tracking-widest mb-2">Contact Details</h3>
<div class="flex items-center justify-between py-3 border-b border-surface-container">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="person" data-weight="fill">person</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-primary">Alex Miller</p>
<p class="font-body-md text-body-md text-secondary">555-0123</p>
</div>
</div>
<button class="w-10 h-10 rounded-full border border-surface-variant flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="call" data-weight="fill">call</span>
</button>
</div>
</section>
</main>
<!-- Bottom Actions (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-surface-container shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-50">
<div class="max-w-[600px] mx-auto px-margin-mobile py-4 flex gap-4">
<button class="flex-1 h-[56px] rounded-lg border border-primary bg-background text-primary font-body-lg text-body-lg flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-[0.98]">
                Reject
            </button>
<button class="flex-1 h-[56px] rounded-lg bg-primary text-on-primary font-body-lg text-body-lg flex items-center justify-center hover:opacity-90 transition-opacity shadow-sm active:scale-[0.98]">
                Accept Request
            </button>
</div>
</div>
