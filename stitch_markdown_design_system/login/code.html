<style>
        .input-underline {
            appearance: none;
            background-color: transparent;
            border: none;
            border-bottom: 1px solid theme('colors.primary');
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 8px;
            transition: all 0.2s ease;
        }
        .input-underline:focus {
            outline: none;
            border-bottom-width: 2px;
            border-color: theme('colors.primary');
            box-shadow: none;
        }
        .input-underline::placeholder {
            color: theme('colors.secondary');
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<div class="max-w-[600px] w-full mx-auto px-margin-mobile flex-1 flex flex-col relative">
<!-- Header / Logo -->
<header class="pt-stack-lg pb-stack-md flex justify-center items-center w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tighter">RepairLink</h1>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col mt-stack-md">
<h2 class="font-headline-xl text-headline-xl text-primary mb-stack-lg">Welcome</h2>
<form class="flex flex-col gap-stack-md w-full">
<!-- Phone Field -->
<div class="relative w-full">
<input autocomplete="tel" class="input-underline w-full font-body-lg text-body-lg text-primary" id="phone" placeholder="Phone number" type="tel"/>
</div>
<!-- Password Field -->
<div class="relative w-full">
<input autocomplete="current-password" class="input-underline w-full font-body-lg text-body-lg text-primary" id="password" placeholder="Password" type="password"/>
</div>
<!-- Primary Button -->
<button class="mt-stack-sm w-full h-[56px] bg-primary text-on-primary font-body-lg text-body-lg rounded-DEFAULT flex items-center justify-center hover:opacity-90 transition-opacity active:scale-[0.98]" type="button">
                    Continue
                </button>
</form>
<!-- Sign Up Link -->
<div class="mt-stack-md text-center">
<p class="font-body-md text-body-md text-secondary">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Sign up</a>
</p>
</div>
<!-- Spacer to push social down if needed, or keep tight flow -->
<div class="flex-1"></div>
<!-- Social Login Section -->
<div class="mt-stack-lg mb-stack-lg w-full">
<!-- Divider -->
<div class="relative flex items-center justify-center mb-stack-md">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container-high"></div>
</div>
<div class="relative bg-background px-4">
<span class="font-body-md text-body-md text-secondary">Or continue with</span>
</div>
</div>
<!-- Social Buttons -->
<div class="flex justify-center gap-gutter">
<!-- Google Button -->
<button class="w-[56px] h-[56px] rounded-full border border-primary bg-background flex items-center justify-center hover:bg-surface-container-lowest transition-colors active:scale-95 shadow-sm">
<!-- Custom basic SVG for Google standard icon shape representation as per pure minimal request -->
<svg class="w-6 h-6" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<!-- Apple Button -->
<button class="w-[56px] h-[56px] rounded-full border border-primary bg-background flex items-center justify-center hover:bg-surface-container-lowest transition-colors active:scale-95 shadow-sm">
<svg class="w-6 h-6" fill="black" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.05 2.26.45 3.09.45.71 0 1.88-.59 3.41-.45 1.14.05 2.76.38 3.94 1.95-3.32 2.03-2.73 6.06.49 7.37-1.04 2.59-1.92 2.8-2.93 3.65zM12.04 7.21c-.13-2.66 2.37-4.99 4.91-5.21.36 2.87-2.58 5.16-4.91 5.21z"></path>
</svg>
</button>

</div>
