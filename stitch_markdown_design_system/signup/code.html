<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RepairLink - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#1b1b1b",
                        "on-secondary-container": "#626262",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#1b1c1c",
                        "tertiary-container": "#1a1c1c",
                        "surface": "#F9F9F9",
                        "secondary-fixed-dim": "#c7c6c6",
                        "surface-tint": "#5e5e5e",
                        "surface-container": "#eeeeee",
                        "on-error-container": "#93000a",
                        "primary-container": "#1b1b1b",
                        "on-tertiary-container": "#838484",
                        "surface-bright": "#f9f9f9",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f3f3f3",
                        "on-background": "#1b1b1b",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "success-green": "#22C55E",
                        "outline-variant": "#cfc4c5",
                        "on-primary": "#ffffff",
                        "secondary-container": "#e1dfdf",
                        "background": "#FFFFFF",
                        "primary-fixed": "#e2e2e2",
                        "on-primary-fixed": "#1b1b1b",
                        "inverse-surface": "#303030",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#e2e2e2",
                        "on-tertiary-fixed": "#1a1c1c",
                        "on-tertiary": "#ffffff",
                        "error-red": "#EF4444",
                        "inverse-primary": "#c6c6c6",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed-variant": "#464747",
                        "surface-dim": "#dadada",
                        "inverse-on-surface": "#f1f1f1",
                        "on-surface-variant": "#4c4546",
                        "primary": "#000000",
                        "secondary": "#5e5e5e",
                        "secondary-fixed": "#e4e2e2",
                        "tertiary": "#000000",
                        "primary-fixed-dim": "#c6c6c6",
                        "on-primary-fixed-variant": "#474747",
                        "surface-container-high": "#e8e8e8",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-primary-container": "#848484",
                        "surface-variant": "#e2e2e2",
                        "outline": "#7e7576"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "stack-sm": "12px",
                        "stack-lg": "48px",
                        "base": "8px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"],

                        "headline-xl": ["Hanken Grotesk"]

                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],

                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.04em", "fontWeight": "800" }]

                }
            }
        }

<style>
        /* Minimalist Input Focus Utilities */
        input:focus {
            outline: none;
            border-bottom-width: 2px;
            border-bottom-color: #000000;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface antialiased selection:bg-primary selection:text-on-primary">
<!-- Main Content Area -->
<main class="flex-grow flex flex-col px-margin-mobile pt-stack-lg pb-stack-lg md:max-w-[600px] md:mx-auto w-full">
<!-- Header -->
<header class="mb-stack-lg">
<h1 class="font-headline-xl text-headline-xl text-primary md:font-headline-xl md:text-headline-xl">Create Account</h1>
</header>
<!-- Form Area -->
<form class="flex flex-col gap-stack-md flex-grow">
<!-- Input Stack -->
<div class="flex flex-col gap-stack-md">
<!-- Full Name -->
<div class="relative group">
<input class="w-full bg-transparent border-0 border-b border-outline pb-2 px-0 text-on-surface font-body-lg text-body-lg placeholder:text-secondary focus:ring-0 focus:border-b-2 focus:border-primary transition-all rounded-none" id="fullName" placeholder="Full Name" required="" type="text"/>
</div>
<!-- Phone Number -->
<div class="relative group">
<input class="w-full bg-transparent border-0 border-b border-outline pb-2 px-0 text-on-surface font-body-lg text-body-lg placeholder:text-secondary focus:ring-0 focus:border-b-2 focus:border-primary transition-all rounded-none" id="phoneNumber" placeholder="Phone Number" required="" type="tel"/>
</div>
<!-- Email -->
<div class="relative group">
<input class="w-full bg-transparent border-0 border-b border-outline pb-2 px-0 text-on-surface font-body-lg text-body-lg placeholder:text-secondary focus:ring-0 focus:border-b-2 focus:border-primary transition-all rounded-none" id="emailAddress" placeholder="Email Address" required="" type="email"/>
</div>
<!-- Password -->
<div class="relative group">
<input class="w-full bg-transparent border-0 border-b border-outline pb-2 px-0 text-on-surface font-body-lg text-body-lg placeholder:text-secondary focus:ring-0 focus:border-b-2 focus:border-primary transition-all rounded-none" id="password" placeholder="Password" required="" type="password"/>
</div>
</div>
<!-- Role Selection Segmented Control -->
<div class="mt-stack-sm flex flex-col gap-base">
<p class="font-label-md text-label-md text-secondary uppercase tracking-widest">I am a...</p>
<div class="flex bg-surface-container-low p-1 rounded-lg">
<button class="flex-1 py-3 text-center rounded-DEFAULT font-body-lg text-body-lg bg-primary text-on-primary transition-all" id="roleCustomer" type="button">
                        Customer
                    </button>
<button class="flex-1 py-3 text-center rounded-DEFAULT font-body-lg text-body-lg bg-transparent text-secondary hover:text-primary transition-all" id="roleShopOwner" type="button">
                        Shop Owner
                    </button>
</div>
</div>
<input id="selectedRole" name="role" type="hidden" value="customer"/>
<!-- Spacer to push button to bottom if needed on very tall screens, but kept inline for this flow -->
<div class="flex-grow"></div>
<!-- Submit Action -->
<div class="flex flex-col gap-stack-sm mt-stack-lg">
<button class="w-full h-[56px] bg-primary text-on-primary rounded-lg font-headline-md text-headline-md flex items-center justify-center hover:opacity-90 transition-opacity active:scale-[0.98]" type="submit">
                    Create Account
                </button>
<p class="text-center font-body-md text-body-md text-secondary">
                    Already have an account? <a class="font-bold text-primary hover:underline" href="#">Log in</a>
</p>
</div>
</form>
</main>
<script>
        // Simple logic for the segmented control
        document.addEventListener('DOMContentLoaded', () => {
            const btnCustomer = document.getElementById('roleCustomer');
            const btnShopOwner = document.getElementById('roleShopOwner');
            const hiddenRoleInput = document.getElementById('selectedRole');

            const setActive = (activeBtn, inactiveBtn, roleValue) => {
                // Active styles
                activeBtn.classList.remove('bg-transparent', 'text-secondary');
                activeBtn.classList.add('bg-primary', 'text-on-primary');
                
                // Inactive styles
                inactiveBtn.classList.remove('bg-primary', 'text-on-primary');
                inactiveBtn.classList.add('bg-transparent', 'text-secondary');
                
                hiddenRoleInput.value = roleValue;
            };

            btnCustomer.addEventListener('click', () => setActive(btnCustomer, btnShopOwner, 'customer'));
            btnShopOwner.addEventListener('click', () => setActive(btnShopOwner, btnCustomer, 'shop_owner'));
        });
    </script>
</body></html>
